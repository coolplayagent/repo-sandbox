name: End-to-end scenario matrix

on:
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - 'scripts/e2e/**'
      - 'scripts/docker/**'
      - 'tests/e2e/**'
      - 'tests/multistage/**'
      - 'templates/**'
      - '.github/workflows/e2e-matrix.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Rust formatting
        run: cargo fmt --all -- --check
      - name: Rust clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Workspace tests and local public Git fixture
        run: cargo test --workspace --all-features
      - name: Validate and list the unified matrix
        run: cargo run -p repo-sandbox-adapters --bin e2e-matrix -- --list
      - name: Shell driver contracts
        run: bash -n scripts/e2e/*.sh scripts/docker/multistage-acceptance.sh

  docker-required:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: amd64,arm64
      - name: Install XFS quota tooling
        run: sudo apt-get update && sudo apt-get install --yes xfsprogs
      - name: Start task-owned XFS pquota Docker daemon
        run: |
          docker_host=$(sudo scripts/e2e/ci-quota-docker.sh start "$RUNNER_TEMP" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT")
          echo "DOCKER_HOST=$docker_host" >> "$GITHUB_ENV"
          export DOCKER_HOST="$docker_host"
          builder="repo-sandbox-ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          docker buildx create --name "$builder" --driver docker-container --driver-opt network=host --use
          echo "REPO_SANDBOX_BUILDER=$builder" >> "$GITHUB_ENV"
      - name: Run required local Docker scenarios
        run: cargo run -p repo-sandbox-adapters --bin e2e-matrix -- --target docker
      - name: Upload scenario logs and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-matrix-results
          path: target/e2e/
          if-no-files-found: error
      - name: Stop task-owned Docker daemon and remove quota storage
        if: always()
        run: sudo scripts/e2e/ci-quota-docker.sh stop "$RUNNER_TEMP" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
