name: Release CLI

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  BAZEL_CACHE_NAMESPACE: bazel-release-v1

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-amd64
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - name: Checkout the tagged commit without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate immutable release inputs
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          scripts/ci/validate-release.sh "$GITHUB_REF_NAME"
      - name: Install checksum-pinned Bazelisk
        run: scripts/ci/install-bazelisk.sh "$RUNNER_TEMP/bin"
      - name: Restore release Bazel cache namespace
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cache/bazel
            ~/.cache/bazelisk
          key: ${{ env.BAZEL_CACHE_NAMESPACE }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.bazelversion', 'MODULE.bazel', 'MODULE.bazel.lock', 'Cargo.lock') }}
          restore-keys: |
            ${{ env.BAZEL_CACHE_NAMESPACE }}-${{ runner.os }}-${{ runner.arch }}-
      - name: Build and test with Bazel
        run: |
          bazelisk build --config=release //:repo-sandbox
          bazelisk test //...
      - name: Package versioned CLI and checksum
        env:
          RELEASE_PLATFORM: ${{ matrix.platform }}
        run: |
          binary=$(bazelisk cquery --config=release //:repo-sandbox --output=files | tail -n 1)
          scripts/ci/package-cli.sh "$GITHUB_REF_NAME" "$RELEASE_PLATFORM" "$binary" release
      - name: Upload immutable run artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cli-${{ matrix.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: release/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish:
    name: Publish protected tag release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
    steps:
      - name: Checkout release contracts without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate immutable release inputs
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          scripts/ci/validate-release.sh "$GITHUB_REF_NAME"
      - name: Download this run's build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: cli-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: release
          merge-multiple: true
      - name: Verify artifact set and checksums
        run: |
          version=${GITHUB_REF_NAME#v}
          for platform in linux-amd64 linux-arm64; do
            archive="repo-sandbox-${version}-${platform}.tar.gz"
            checksum="${archive}.sha256"
            test -f "release/$archive"
            test -f "release/$checksum"
            (cd release && sha256sum --check --strict "$checksum")
          done
          test "$(find release -maxdepth 1 -type f | wc -l)" -eq 4
          (cd release && sha256sum repo-sandbox-*.tar.gz > SHA256SUMS)
      - name: Publish GitHub Release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --notes 'Download the archive for your platform and verify it against SHA256SUMS before execution.'

  fresh-machine:
    name: Fresh machine ${{ matrix.platform }}
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-amd64
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
    runs-on: ${{ matrix.runner }}
    container: ubuntu:24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Install only fresh-machine download prerequisites
        run: apt-get update && apt-get install --yes ca-certificates curl
      - name: Download public release, verify SHA-256, and run version
        env:
          RELEASE_BASE_URL: https://github.com/${{ github.repository }}/releases/download
          RELEASE_PLATFORM: ${{ matrix.platform }}
        run: |
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output /tmp/verify-release.sh \
            "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/scripts/ci/verify-release.sh"
          chmod +x /tmp/verify-release.sh
          /tmp/verify-release.sh "$GITHUB_REF_NAME" "$RELEASE_PLATFORM" "$RELEASE_BASE_URL"
