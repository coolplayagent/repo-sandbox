id: rust-bazel-acceptance-secret-artifact
version: "1.0.1"
base_image: docker.io/library/rust:1.97.0-bookworm
components: [{ id: base-tools }, { id: bazel, depends_on: [base-tools] }, { id: rust, depends_on: [base-tools] }]
target_platforms: [linux/amd64, linux/arm64]
build_context: templates/rust-bazel/context
execution:
  version: 1
  build: [{ name: acceptance-build, command: "true" }]
  test:
    - name: acceptance-secret-artifact
      command: "test -n \"$REPO_SANDBOX_E2E_PROFILE_SECRET\"; mkdir -p profile-artifacts; printf 'artifact-ok\\n' > profile-artifacts/profile-artifact.txt"
  resources: { cpu: 1, memory_mb: 256, temporary_storage_mb: 64 }
  timeout_seconds: 120
  fail_fast: true
  secret_environment: [REPO_SANDBOX_E2E_PROFILE_SECRET]
  artifact_directories: [profile-artifacts]
