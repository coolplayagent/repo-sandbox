id: rust-bazel
version: "1.0.1"
base_image: docker.io/library/rust:${rust_version}-bookworm
components:
  - id: base-tools
  - id: bazel
    depends_on: [base-tools]
  - id: rust
    depends_on: [base-tools]
target_platforms:
  - linux/amd64
  - linux/arm64
build_context: templates/rust-bazel/context
parameters:
  rust_version:
    default: "1.97.0"
  registry_repository:
    default: ""
execution:
  version: 1
  build:
    - name: bazel-build
      command: bazel build //...
  test:
    - name: bazel-test
      command: bazel test //...
  resources:
    cpu: 2
    memory_mb: 4096
    temporary_storage_mb: 8192
  timeout_seconds: 1800
  fail_fast: true
  environment_allow: []
  secret_environment: []
  artifact_directories: []
  registry:
    repository: "${registry_repository}"
    aliases: [verified]
